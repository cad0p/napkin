name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          # Major-only pin: resolves the latest 11.x. Previously read from
          # the `packageManager` field — dropped because it conflicts with
          # the release action's own pnpm pin (see #160). Same style as the
          # release action's `version: 11`.
          version: 11
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: ./node_modules/.bin/biome check src/
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Run tests
        run: ./node_modules/.bin/vitest run
