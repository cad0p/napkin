name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
        with:
          # Pinned explicitly (was previously read from the dropped
          # `packageManager` field — which conflicts with the release
          # action's own pnpm pin, see #160). Keep in sync with the
          # lockfile; a pnpm release regression can't break CI without
          # an explicit bump here.
          version: 11.15.0
      - uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: ./node_modules/.bin/biome check src/
      - name: Type check
        run: ./node_modules/.bin/tsc --noEmit
      - name: Run tests
        run: ./node_modules/.bin/vitest run
