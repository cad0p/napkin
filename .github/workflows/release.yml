name: Auto Release

on:
  push:
    branches: [main, 'release/*']
  workflow_dispatch:
    inputs:
      publish_version:
        description: 'Manually publish this version to npm (e.g. v0.13.1). Escapes the base-version publish when the tag already exists (calver path).'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      has_changes: ${{ steps.release.outputs.has_changes }}
    steps:
      - id: release
        uses: cad0p/semver-calver-release/release@v1
        with:
          skip_release: ${{ github.ref != 'refs/heads/main' }}

  publish:
    needs: release
    if: >
      github.ref == 'refs/heads/main' &&
      (needs.release.outputs.has_changes == 'true' || inputs.publish_version != '')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: cad0p/semver-calver-release/npm-publish@v1
        with:
          tag: ${{ inputs.publish_version != '' && inputs.publish_version || format('v{0}', needs.release.outputs.version) }}
